<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MY MONEY MAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@300;400;500&display=swap">
<style>
/* Layout: one narrow column, one step at a time (00 → 01 → 02 → 03 → 06 → 07). Each step = a few inputs + one big live answer. Single dark theme by choice (J's black-gold). */
:root{
  --bg:#0D0C0A; --panel:#15130F; --panel2:#1B1813; --line:#2C271E; --line2:#4A3F2A;
  --ink:#EEE7D7; --mute:#9A9180; --dim:#6B6457; --gold:#C9A961; --hi:#E6CF94; --warn:#D99B6C; --ok:#B4BE8E; --cash:#EADBB4;
  --display:'Cormorant Garamond','Times New Roman',serif;
  --serif:'Noto Serif TC','Noto Serif CJK TC','Songti TC','PMingLiU',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(90% 45% at 50% -10%,rgba(201,169,97,.10),transparent 60%)}
.wrap{position:relative;max-width:660px;margin:0 auto;padding-inline:20px;padding-block:22px 72px}
.wrap.wide{max-width:820px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid var(--hi);outline-offset:3px}
.num{font-family:var(--display);font-variant-numeric:lining-nums tabular-nums}
.en{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.mute{color:var(--mute)}
.fine{font-size:12.5px;color:var(--dim);line-height:1.7}
.hidden{display:none!important}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.top .brand{font-family:var(--display);letter-spacing:.24em;color:var(--gold);font-size:12.5px}
.link{background:none;border:0;padding:6px 0;cursor:pointer;font-size:13.5px;letter-spacing:.08em;color:var(--mute)}
.link:hover{color:var(--hi)}
.dots{display:flex;gap:6px;margin-top:16px}
.dot{flex:1;height:30px;background:none;border:0;border-top:2px solid var(--line);padding:6px 0 0;font-family:var(--display);font-size:12px;letter-spacing:.12em;color:var(--dim);cursor:pointer;text-align:left}
.dot.done{border-color:var(--gold);color:var(--mute)}
.dot.cur{border-color:var(--hi);color:var(--hi)}
.dot:disabled{cursor:default}

/* home */
.hero{text-align:center;padding:56px 0 30px}
.hero h1{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(44px,11vw,80px);letter-spacing:.08em;line-height:1;color:var(--hi)}
.hero .mott{margin-top:18px;font-family:var(--display);font-style:italic;font-size:clamp(17px,3.8vw,21px);line-height:1.6}
.hero .mott span{display:block}.hero .mott span:last-child{color:var(--gold)}
.bar{height:3px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--hi));transition:width .8s cubic-bezier(.2,.7,.2,1)}
.prog{margin:30px auto 0;max-width:420px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.prog .pc{font-family:var(--display);font-size:28px;color:var(--hi)}
.steps{margin-top:40px;border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 4px;text-align:left;cursor:pointer;transition:padding .25s}
.srow:hover:not(:disabled):not(.learn){padding-left:12px}
.srow:disabled{cursor:default;opacity:.5}
.srow .no{font-family:var(--display);font-size:20px;color:var(--gold)}
.srow .t{font-family:var(--display);font-size:19px;letter-spacing:.1em;font-weight:500}
.srow .s{display:block;font-size:14px;color:var(--mute)}
.st{font-size:12.5px;letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.st.ok{color:var(--gold)}
.srow.learn{cursor:default;padding:10px 4px}
.srow.learn .no{color:var(--dim);font-size:15px}
.srow.learn .t{color:var(--dim);font-family:var(--serif);font-size:14px;letter-spacing:.06em;font-weight:300}
.cta{display:block;width:100%;margin-top:30px}
.homefoot{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;margin-top:34px}

/* step page */
.head{padding:34px 0 8px}
.head .ch{font-family:var(--display);font-size:13px;letter-spacing:.24em;color:var(--gold)}
.head h1{margin:6px 0 0;font-family:var(--display);font-weight:500;font-size:clamp(34px,8vw,46px);letter-spacing:.05em;line-height:1.1}
.head p{margin:10px 0 0;color:var(--mute);font-size:15px}
.blk{padding-top:30px}
.q{display:flex;align-items:baseline;gap:10px;margin:0 0 6px;font-size:18px;font-weight:400}
.q .k{font-family:var(--display);color:var(--gold);font-size:16px}
.sub{margin:0 0 12px;font-size:14px;color:var(--mute)}

.fld{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding:10px 0;min-width:0}
.fld:focus-within{border-bottom-color:var(--gold)}
.fld label{flex:1;font-size:15.5px;min-width:0}
.fld label small{display:block;font-size:12px;color:var(--dim)}
.fld .cur{font-family:var(--display);font-size:13px;color:var(--dim);letter-spacing:.08em}
.fld input{width:8.5em;max-width:52%;background:transparent;border:0;color:var(--ink);font-family:var(--display);font-size:21px;text-align:right;font-variant-numeric:lining-nums tabular-nums;padding:2px 0;outline:none}
.fld input::placeholder,.txt::placeholder{color:#4C463B}
.txt{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line2);color:var(--ink);font:400 18px/1.6 var(--serif);padding:8px 2px;outline:none;border-radius:0}
.txt:focus{border-color:var(--gold)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.box{border:1px solid var(--line2);padding:18px 18px 14px;background:linear-gradient(180deg,var(--panel2),var(--panel));min-width:0}
.box .bt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.box .bt b{font-weight:400;font-size:16px}
.box .fld input{width:6.5em;font-size:19px}
.box .fld label{font-size:15px}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:12px;margin-top:4px;border-top:1px solid var(--line2);font-size:14px;color:var(--mute)}
.sum .v{font-family:var(--display);font-size:22px;color:var(--hi)}
.quote{margin:12px 0 0;font-size:13px;color:var(--gold)}

/* answer box */
.ans{margin-top:22px;border:1px solid var(--line2);padding:26px 20px 22px;text-align:center;background:radial-gradient(100% 130% at 50% 0%,#211B11,var(--panel))}
.ans .l{font-size:13.5px;letter-spacing:.12em;color:var(--mute)}
.ans .big{font-family:var(--display);font-size:clamp(40px,10vw,60px);color:var(--hi);line-height:1.15;font-variant-numeric:lining-nums tabular-nums}
.ans .big.q{color:var(--dim)}
.ans .big.neg{color:var(--warn)}
.ans .s{margin-top:8px;font-size:14px;color:var(--mute)}
.ans .s b{font-family:var(--display);font-weight:500;font-size:18px;color:var(--ink)}
.ans .say{margin-top:12px;font-size:16px}
.arrow{text-align:center;color:var(--line2);font-family:var(--display);font-size:20px;padding:8px 0}

/* chips */
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{border:1px solid var(--line);background:transparent;padding:14px 8px;cursor:pointer;text-align:center;font-size:15px;border-radius:0;transition:all .25s;position:relative}
.chip:hover{border-color:var(--line2)}
.chip[aria-pressed=true]{border-color:var(--gold);color:var(--hi);background:linear-gradient(180deg,rgba(201,169,97,.13),rgba(201,169,97,.02))}
.chip small{display:block;font-size:11.5px;color:var(--gold)}
.chips.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.chip .big{display:block;font-family:var(--display);font-size:26px;line-height:1.2}
.other{margin-top:12px;border:1px solid var(--gold);padding:14px 16px 10px}
.other label{display:block;font-size:13px;color:var(--gold)}
.other .txt:focus-visible{outline:none}
.list{border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:14px;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;padding:13px 4px;cursor:pointer;font-size:16px}
.opt .d{margin-left:auto;width:9px;height:9px;border:1px solid var(--line2);transform:rotate(45deg);flex:none}
.opt[aria-pressed=true]{color:var(--hi)}
.opt[aria-pressed=true] .d{background:var(--gold);border-color:var(--gold)}

/* goals */
.goal{border:1px solid var(--line2);padding:16px 18px 14px;margin-top:12px;background:var(--panel)}
.goal .gtop{display:flex;gap:10px;align-items:center}
.goal .gtop .txt{font-size:19px;padding:4px 0}
.del{background:none;border:0;color:var(--dim);cursor:pointer;font-size:13px;padding:6px;white-space:nowrap}
.del:hover{color:var(--warn)}
.ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 16px}
.ggrid .fld{flex-direction:column;align-items:stretch;gap:0}
.ggrid .fld label{font-size:12.5px;color:var(--mute)}
.ggrid .fld input{width:100%;max-width:none;text-align:left;font-size:20px}
.ym{display:flex;align-items:baseline;gap:6px}.ym .mute{font-size:13px}
select{background:transparent;border:0;color:var(--ink);font-family:var(--display);font-size:20px;padding:2px 0;outline:none}
select option{background:var(--panel);color:var(--ink)}
.gout{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin-top:10px;font-size:14px;color:var(--mute)}
.gout b{font-family:var(--display);font-weight:500;font-size:19px;color:var(--hi);margin-left:4px}
.tag{font-size:12px;border:1px solid var(--line2);padding:1px 8px;color:var(--mute)}
.tag.short{border-color:rgba(234,219,180,.5);color:var(--cash)}
.tag.long{border-color:rgba(201,169,97,.6);color:var(--gold)}
.add{margin-top:12px;width:100%;background:transparent;border:1px dashed var(--line2);color:var(--gold);padding:14px;cursor:pointer;font-size:15px;letter-spacing:.08em}
.add:hover{border-color:var(--gold)}
.rule{margin-top:14px;font-size:13.5px;color:var(--mute);border-left:1px solid var(--gold);padding:2px 0 2px 14px}
.fld.ex .exn{flex:1;width:auto;max-width:none;min-width:0;text-align:left;font-family:var(--serif);font-size:15px;font-weight:300}
.fld.ex .exa{width:6.5em}
.box .fld.ex .exa{width:5.5em}
.exd{background:none;border:0;color:var(--dim);cursor:pointer;font-size:17px;line-height:1;padding:0 2px}.exd:hover{color:var(--warn)}
.addx{display:block;background:none;border:0;color:var(--gold);font-size:13.5px;letter-spacing:.06em;padding:10px 0 4px;cursor:pointer}
.addx:hover{color:var(--hi)}
.quote2{font-size:17px;line-height:1.8;color:var(--hi);border-left:1px solid var(--gold);padding-left:16px;margin:0}
.grp{margin-top:28px}
.grp-h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line2);padding-bottom:8px}
.grp-h .en{font-size:13px;color:var(--gold)}.grp-h b{font-weight:400;font-size:17px}
.adds{display:flex;gap:10px;flex-wrap:wrap}.adds .add{flex:1 1 220px}
.gk{font-size:12px;color:var(--gold);letter-spacing:.1em;margin-bottom:2px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.seg .chip{padding:8px 14px;font-size:14px}
.fx2{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-top:12px;font-size:14px}.fx2 .seg{margin-top:0}
.acc{margin-top:12px;border-left:1px solid var(--gold);padding:4px 0 4px 14px;font-size:14.5px}
.acc div{display:flex;gap:12px}.acc span{color:var(--mute);width:5em;flex:none}
.acc p,.acc-q{margin:10px 0 0;color:var(--hi);font-size:14.5px}
.acc-q{margin:8px 0 10px}
.need{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.need b{font-family:var(--display);font-size:28px;font-weight:500;color:var(--hi)}
.gsub{font-size:13px;color:var(--mute)}
.okline{margin:10px 0 0;color:var(--ok);font-size:14px}
.gmap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gm{border:1px solid var(--line2);padding:14px 16px;background:var(--panel);min-width:0}
.gm-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.gm-t{font-size:15px;min-width:0;overflow-wrap:anywhere}.gm-d{font-family:var(--display);font-size:16px;color:var(--gold);white-space:nowrap}
.gm-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:8px}.gm-g span{display:block;font-size:12px;color:var(--mute)}.gm-g b{font-family:var(--display);font-weight:500;font-size:18px}.gm-g .hl b{color:var(--hi)}
.gm-o{margin-top:8px;font-size:14px;color:var(--mute)}
.rt{margin-top:14px;border:1px solid var(--line2);padding:6px 16px 12px}
.rt-r{display:grid;grid-template-columns:minmax(0,1fr) 7.5em 7.5em;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rt-r small{display:block;font-size:12px;color:var(--dim)}
.rt-r span:nth-child(n+2){font-family:var(--display);font-size:18px;text-align:right;color:var(--mute)}
.rt-r span.on{color:var(--hi)}
.rt-h span:nth-child(n+2){font-size:13px;letter-spacing:.1em;color:var(--gold)}
.rt p{margin:10px 0 0;font-size:13.5px;color:var(--mute)}.rt p b{font-family:var(--display);font-weight:500;font-size:17px;color:var(--hi)}
@media (max-width:420px){.rt-r{grid-template-columns:minmax(0,1fr) 6em 6em}.rt-r span:nth-child(n+2){font-size:16px}}
.rc{border-top:1px solid var(--line)}
.rc-r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.rc-n{font-size:16px;min-width:0}.rc-n small{display:block;font-size:12.5px;color:var(--mute)}
.rc-p{font-size:12.5px;padding:2px 10px;border:1px solid var(--gold);color:var(--gold);white-space:nowrap}.rc-p.c{border-color:rgba(234,219,180,.6);color:var(--cash)}
@media (max-width:640px){.gmap{grid-template-columns:minmax(0,1fr)}.ggrid .fld:nth-child(3){grid-column:1/-1}}
.gt-axis{display:flex;justify-content:space-between;font-family:var(--display);font-size:12.5px;color:var(--dim);letter-spacing:.1em;margin-top:18px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.gt{padding:14px 0;border-bottom:1px solid var(--line)}
.gt-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gt-n{font-size:16px;min-width:0;overflow-wrap:anywhere}
.gst{font-size:12.5px;padding:1px 9px;border:1px solid;white-space:nowrap}
.gst.ok{color:var(--ok);border-color:rgba(180,190,142,.5)}.gst.bad{color:var(--warn);border-color:rgba(217,155,108,.55)}
.gt-track{position:relative;height:10px;background:var(--line);margin:10px 0 8px}
.gt-track i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--hi))}
.gt-track i.bad{background:linear-gradient(90deg,#B98A5E,var(--warn))}
.gt-dl{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}
.gt-d{font-size:13px;color:var(--mute)}.gt-d b{font-family:var(--display);font-weight:500;font-size:16px;color:var(--ink)}
.tl-row .it small{display:block;font-size:12px;color:var(--ok)}.tl-row .it small.bad{color:var(--warn)}
.rates{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rates .chip{padding:8px 16px;flex:0 0 auto}

.verdict{margin-top:22px;border:1px solid var(--line2);padding:22px 20px}
.verdict.bad{border-color:rgba(217,155,108,.55);background:linear-gradient(180deg,rgba(217,155,108,.08),transparent)}
.verdict.good{border-color:rgba(180,190,142,.45);background:linear-gradient(180deg,rgba(180,190,142,.07),transparent)}
.verdict .vt{font-family:var(--display);font-size:20px;letter-spacing:.16em;font-weight:600;margin-bottom:6px}
.verdict.bad .vt{color:var(--warn)}.verdict.good .vt{color:var(--ok)}
.vrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.vrow:last-of-type{border-bottom:0}
.vrow .v{font-family:var(--display);font-size:20px}
.fix{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.fix div{border:1px solid var(--line2);padding:10px 6px;text-align:center;font-size:14px}

/* split bar */
.split{display:flex;height:14px;margin:16px 0 14px;background:var(--line)}
.split i{display:block;height:100%;transition:width .5s}
.legend .r{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.legend .r:last-child{border-bottom:0}
.legend .sw{width:9px;height:9px;transform:rotate(45deg)}
.legend .n{font-size:16px}
.legend .p{display:block;font-size:13px;color:var(--mute)}
.legend .v{font-family:var(--display);font-size:21px;text-align:right}
.legend .v small{display:block;font-size:13px;color:var(--mute)}
.note{margin-top:14px;font-size:14px;color:var(--mute);border-left:1px solid var(--gold);padding:2px 0 2px 14px}

/* monthly plan */
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow .n{flex:1;font-size:16px;min-width:0}
.mrow .n small{display:block;font-size:12.5px;color:var(--dim)}
.mrow input{width:7em;background:transparent;border:0;border-bottom:1px solid var(--line2);color:var(--ink);font-family:var(--display);font-size:21px;text-align:right;outline:none;padding:2px 0}
.mrow input:focus{border-color:var(--gold)}
.mrow .auto{font-family:var(--display);font-size:21px;color:var(--hi);width:7em;text-align:right}
.mrow.top .auto{color:var(--ink)}
.warn{margin-top:12px;font-size:14px;color:var(--warn)}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:40px}
.err{color:var(--warn);font-size:13.5px;text-align:right;min-height:1.2em;margin-top:28px}
.err+.nav{margin-top:8px}
.btn{font-family:var(--display),var(--serif);font-size:15px;letter-spacing:.16em;font-weight:600;padding:14px 26px;border:1px solid var(--gold);background:var(--gold);color:#16120A;cursor:pointer;border-radius:0;transition:background .25s}
.btn:hover{background:var(--hi);border-color:var(--hi)}
.btn.line{background:transparent;color:var(--gold)}
.btn.line:hover{background:var(--gold);color:#16120A}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* final map */
.sheet{position:relative;background:radial-gradient(110% 55% at 50% 0%,#201B12,#0F0E0B 70%);border:1px solid var(--line2);padding:50px clamp(20px,5vw,54px) 40px;margin-top:22px}
.sheet::before{content:"";position:absolute;inset:9px;border:1px solid rgba(201,169,97,.28);pointer-events:none}
.sheet .sample{position:absolute;top:22px;right:22px;font-size:12px;letter-spacing:.2em;background:var(--gold);color:#16120A;padding:2px 10px}
.mt{text-align:center}
.mt .who{font-family:var(--display);font-size:clamp(20px,5vw,28px);letter-spacing:.32em;color:var(--gold);font-weight:500}
.mt h2{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(46px,11vw,86px);letter-spacing:.08em;line-height:.95;color:var(--hi)}

<script>
(function(){
'use strict';
const KEY='mmm_map_v3', OLDKEY='mmm_map_v2';
const NOW=new Date(), NY=NOW.getFullYear(), NM=NOW.getMonth()+1;

const MEANS=['安全感','時間自由','工作選擇權','買房','旅行','創業','照顧家人','提早退休','其他'];
const PROBLEMS=['不知道錢花去哪裡','存不到錢','不知道自己有多少資產','不知道該留多少現金','想投資但不知道怎麼開始','有投資但沒有計畫','不知道自己的財務目標','不知道怎麼配置資產'];
const FIXED=[['rent','房租'],['food','伙食'],['transport','交通'],['phone','電信'],['insurance','保險'],['subs','固定訂閱']];
const FLEX=[['fun','娛樂'],['shopping','購物'],['social','聚餐'],['hobby','興趣']];
const STEPS=[
  {id:'profile',ch:'00',en:'Profile',zh:'先認識你',lead:'1 分鐘，讓這張地圖認識你。'},
  {id:'snapshot',ch:'01',en:'Where Am I?',zh:'我現在有多少錢',lead:'先把數字攤開。大概的數字就好，不用精準到個位數。'},
  {id:'goals',ch:'02',en:'My Goals',zh:'我的錢要去哪裡',lead:'先決定每一筆錢的角色，再把它放進時間軸。'},
  {id:'safety',ch:'03',en:'Emergency Fund',zh:'先準備好緊急預備金',lead:'就算突然沒有收入，也能好好生活一段時間的錢。'},
  {id:'plan',ch:'06',en:'My Allocation',zh:'我的錢怎麼分',lead:'前面的答案都在這裡了。現在決定：每一筆錢負責什麼。'}
];
const TERMS={short:['短期','0–1 年'],mid:['中期','1–5 年'],long:['長期','5 年以上']};
const termOf=m=>m<=12?'short':m<=60?'mid':'long';

/* ---------- state ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
function blank(){return{v:3,view:'home',profile:{name:'',age:'',means:[],meansOther:'',problem:''},
  assets:{cash:'',invest:''},extra:{assets:[],fixed:[],flex:[]},debt:'',income:'',fixed:{},flex:{},goals:[],rate:0,months:6,
  plan:{safety:null,short:null},goalBudget:null,done:{},wi:{}}}
function migrate(o){ // from the previous version (v2)
  const b=blank(),num=x=>Number(x)||0,tot=x=>Object.values(x||{}).reduce((a,c)=>a+num(c),0);
  b.profile=Object.assign(b.profile,o.profile||{});
  const a=o.assets||{};b.assets={cash:a.cash||'',invest:(num(a.invest)+num(a.stock))||'',other:a.other||''};
  b.debt=tot(o.debts)||'';b.income=tot(o.income)||'';
  const fk=FIXED.map(x=>x[0]),xk=FLEX.map(x=>x[0]);
  Object.entries(o.fixed||{}).forEach(([k,v])=>{const kk=fk.includes(k)?k:'other';b.fixed[kk]=num(b.fixed[kk])+num(v)});
  Object.entries(o.flex||{}).forEach(([k,v])=>{if(k==='food'){b.fixed.food=num(b.fixed.food)+num(v);return}const kk=xk.includes(k)?k:'other';b.flex[kk]=num(b.flex[kk])+num(v)});
  b.goals=(o.goals||[]).map(g=>{const [y,m]=String(g.deadline||'').split('-');return{id:g.id||uid(),name:g.name||'',target:g.target||'',saved:g.current||'',year:+y||NY+1,month:+m||12}});
  b.rate=num(o.goalReturn)>0?8:0;
  const m=o.safety&&o.safety.months;b.months=[3,6,9,12].includes(+m)?+m:6;
  const d=o.done||{};['profile','snapshot','goals','safety'].forEach(k=>{if(d[k])b.done[k]=1});if(d.alloc)b.done.plan=1;
  return b;
}
let s=blank();
function fixV3(o){o.rate=Number(o.rate)>0?8:0;
  o.extra=o.extra||{};['assets','fixed','flex'].forEach(k=>{o.extra[k]=o.extra[k]||[];o[k]=o[k]||{};const v=Number(o[k].other)||0;if(v)o.extra[k].push({id:uid(),name:'其他',amt:v});delete o[k].other});
  (o.goals||[]).forEach(g=>{if(!g.month)g.month=12;if(!g.kind)g.kind='goal';if(g.flexi==null)g.flexi=''});return o}
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===3)s=fixV3(Object.assign(blank(),o))}
  else{const r2=localStorage.getItem(OLDKEY);if(r2){const o=JSON.parse(r2);if(o&&o.v===2)s=fixV3(migrate(o))}}}catch(e){}
let sample=null;
function save(){if(sample)return;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{const x=Number(v);return isFinite(x)?x:0};
const sum=o=>Object.values(o||{}).reduce((a,b)=>a+n(b),0);
const fmt=x=>(x<0?'−':'')+'NT$'+Math.round(Math.abs(x)).toLocaleString('en-US');
const comma=x=>x===''||x==null?'':Math.round(n(x)).toLocaleString('en-US');
const wan=x=>{const a=Math.abs(x),sg=x<0?'−':'';return a>=1e4?sg+'NT$'+(+(a/1e4).toFixed(a>=1e6?0:1))+' 萬':sg+'NT$'+Math.round(a).toLocaleString('en-US')};
const pct=x=>(isFinite(x)?(x*100).toFixed(1):'0.0')+'%';
const up100=x=>Math.max(0,Math.ceil(x/100)*100);
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o)}
function setP(o,p,v){const ks=p.split('.');let c=o;ks.slice(0,-1).forEach(k=>{if(c[k]==null)c[k]={};c=c[k]});c[ks[ks.length-1]]=v}
const isLatin=t=>/^[\x20-\x7E]+$/.test(t);
const owner=nm=>{nm=(nm||'').trim();return !nm?'MY':isLatin(nm)?nm.toUpperCase()+"'S":nm+' 的'};
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2600)}
function pmt(target,months,annual,have){const i=annual>0?Math.pow(1+annual/100,1/12)-1:0;
  if(i===0)return Math.max(0,(target-have)/months);const g=Math.pow(1+i,months),rest=target-have*g;return rest<=0?0:rest*i/(g-1)}
function monthsTo(target,start,monthly,annual){if(start>=target)return 0;const i=annual>0?Math.pow(1+annual/100,1/12)-1:0;let b=start,m=0;while(b<target&&m<1200){b=b*(1+i)+monthly;m++}return m>=1200?null:m}
/* Goals are funded one after another, nearest deadline first. Money for 1-year+ goals compounds at the chosen rate. */
function simulate(goals,budget,rate){const i=rate>0?Math.pow(1+rate/100,1/12)-1:0;
  const L=goals.filter(g=>n(g.target)>0).map(g=>({id:g.id,target:n(g.target),bal:Math.min(n(g.saved),n(g.target)),grow:!g.short,due:g.months,start:n(g.saved)>0?0:null,done:n(g.saved)>=n(g.target)?0:null})).sort((a,b)=>a.due-b.due);
  for(let m=1;m<=600&&L.some(g=>g.done==null);m++){let av=budget;
    L.forEach(g=>{if(g.done==null&&g.grow)g.bal*=1+i});
    for(const g of L){if(g.done!=null)continue;if(av<=0)break;const put=Math.min(av,g.target-g.bal);g.bal+=put;av-=put;if(g.start==null&&put>0)g.start=m-1;if(g.bal>=g.target-.5)g.done=m}
    L.forEach(g=>{if(g.done==null&&g.bal>=g.target-.5)g.done=m})}
  const out={};L.forEach(g=>out[g.id]={start:g.start==null?null:g.start,done:g.done,due:g.due,late:g.done==null?Infinity:Math.max(0,g.done-g.due)});return out}
/* The final map follows the action plan exactly: safety money, short-goal money (cash) and investing money (compounds).
   When the safety net is full its money moves to short goals (or investing); when short goals are done, that money moves to investing. */
function simulatePlan(goals,p,rate){const i=rate>0?Math.pow(1+rate/100,1/12)-1:0;
  const L=goals.filter(g=>n(g.target)>0).map(g=>{const b0=Math.min(n(g.saved),n(g.target));return{id:g.id,short:g.short,target:n(g.target),bal:b0,due:g.months,start:b0>0?0:null,done:b0>=n(g.target)?0:null,series:[b0]}}).sort((a,b)=>a.due-b.due);
  const SG=L.filter(g=>g.short),LG=L.filter(g=>!g.short);let sLeft=p.sNeed;
  const fund=(list,av,m)=>{for(const g of list){if(g.done!=null)continue;if(av<=0)break;const put=Math.min(av,g.target-g.bal);g.bal+=put;av-=put;if(g.start==null&&put>0)g.start=m-1;if(g.bal>=g.target-.5){g.bal=g.target;g.done=m}}return av};
  for(let m=1;m<=600&&L.some(g=>g.done==null);m++){
    let extra;if(sLeft>0){const put=Math.min(p.safetyM,sLeft);sLeft-=put;extra=p.safetyM-put}else extra=p.safetyM;
    const shortOpen=SG.some(g=>g.done==null);
    let inv=p.investM+(shortOpen?0:extra);inv+=fund(SG,p.shortM+(shortOpen?extra:0),m);
    LG.forEach(g=>{if(g.done==null)g.bal*=1+i});fund(LG,inv,m);
    LG.forEach(g=>{if(g.done==null&&g.bal>=g.target-.5){g.bal=g.target;g.done=m}});
    L.forEach(g=>g.series.push(g.bal))}
  const out={};L.forEach(g=>out[g.id]={start:g.start,done:g.done,due:g.due,late:g.done==null?Infinity:Math.max(0,g.done-g.due),series:g.series});return out}
/* Each goal gets its own fixed monthly amount (nearest date first); cash goals don't grow, invested goals compound. */
function simulateEach(goals,alloc,rate){const i=rate>0?Math.pow(1+rate/100,1/12)-1:0,out={};
  goals.filter(g=>n(g.target)>0).forEach(g=>{const tg=n(g.target),a=alloc[g.id]||0,gi=g.cash?0:i;let b=Math.min(n(g.saved),tg);const series=[b];let done=b>=tg?0:null;
    for(let m=1;m<=600&&done==null;m++){b=b*(1+gi)+a;if(b>=tg-.5){b=tg;done=m}series.push(b)}
    out[g.id]={start:0,done,due:g.months,late:done==null?Infinity:Math.max(0,done-g.months),series,alloc:a}});return out}
function budgetForAll(goals,rate){const G=goals.filter(g=>n(g.target)>0);if(!G.length)return 0;
  const ok=b=>{const r=simulate(G,b,rate);return G.every(g=>r[g.id].done!=null&&r[g.id].done<=g.months)};
  let lo=0,hi=Math.max(1000,G.reduce((a,g)=>a+n(g.target),0));if(!ok(hi))return null;
  while(hi-lo>100){const m=(lo+hi)/2;ok(m)?hi=m:lo=m}return up100(hi)}
const ymOf=m=>{const t=NY*12+NM-1+m;return Math.floor(t/12)+'/'+String(t%12+1).padStart(2,'0')};
const dur=m=>m==null?'超過 100 年':m===0?'已達成':m<12?m+' 個月':Math.floor(m/12)+' 年'+(m%12?' '+(m%12)+' 個月':'');

/* ---------- the one model everything reads ---------- */
const tot=(S,k)=>sum(S[k])+(((S.extra||{})[k])||[]).reduce((a,x)=>a+n(x.amt),0);
const monthsOf=g=>Math.max(1,(n(g.year)-NY)*12+((n(g.month)||12)-NM));
const termOfGoal=g=>g.kind==='accum'&&g.mode!=='num'?'long':termOf(monthsOf(g));
function model(S,W){W=W||{};
  const baseInc=n(S.income),baseFix=tot(S,'fixed'),baseFlex=tot(S,'flex');
  const income=W.income!=null?n(W.income):baseInc;
  const scale=W.spend!=null&&baseFix+baseFlex>0?n(W.spend)/(baseFix+baseFlex):1;
  const fixed=baseFix*scale,flex=baseFlex*scale,exp=fixed+flex;
  const surplus=income-exp,rate=income>0?surplus/income:0;
  const assets=tot(S,'assets'),debt=n(S.debt),nw=assets-debt,cash=n(S.assets.cash);
  const essential=baseFix,sTarget=essential*S.months,sNeed=Math.max(0,sTarget-cash),sPct=sTarget>0?Math.min(1,cash/sTarget):0;
  /* cash goals = short-term, plus mid-term goals whose date is fixed; everything else may be invested */
  const goals=(S.goals||[]).map(g=>{const open=g.kind==='accum'&&g.mode!=='num',months=open?600:monthsOf(g),term=open?'long':termOf(months);
    const cash=!open&&(term==='short'||(term==='mid'&&g.flexi==='fixed'));const tg=open?0:n(g.target),sv=n(g.saved),still=Math.max(0,tg-sv);
    return Object.assign({},g,{open,months,term,cash,short:cash,still,need02:tg>0?still/months:0,monthly:tg>0?pmt(tg,months,cash?0:n(S.rate),sv):0})});
  const shortNeed=goals.filter(g=>g.short).reduce((a,g)=>a+g.monthly,0);
  const longNeed=goals.filter(g=>!g.short).reduce((a,g)=>a+g.monthly,0);
  const goalNeed=shortNeed+longNeed;
  const budget02=S.goalBudget!=null&&S.goalBudget!==''?n(S.goalBudget):Math.max(0,surplus);
  let sSug=0;if(sNeed>0&&surplus>0)sSug=Math.max(100,up100(Math.min(sNeed/12,surplus*.3)));
  sSug=Math.min(sSug,Math.max(0,surplus));
  const safetyM=S.plan.safety!=null&&S.plan.safety!==''?n(S.plan.safety):sSug;
  const shortSug=Math.min(up100(shortNeed),Math.max(0,surplus-safetyM));
  const shortM=S.plan.short!=null&&S.plan.short!==''?n(S.plan.short):shortSug;
  const investM=Math.max(0,surplus-safetyM-shortM),over=Math.max(0,safetyM+shortM-surplus);
  const safetyETA=sNeed<=0?0:safetyM>0?Math.ceil(sNeed/safetyM):null;
  const shortSaved=goals.filter(g=>g.short).reduce((a,g)=>a+n(g.saved),0);
  const cashNeed=sTarget+shortSaved,pos=Math.max(0,nw);
  const cashPart=Math.min(pos,cashNeed),longPart=Math.max(0,pos-cashPart);
  const million=monthsTo(1e6,nw,Math.max(0,surplus),n(S.rate));
  const budgetMap=Math.max(0,surplus-safetyM);
  const alloc={},byDate=(a,b)=>a.months-b.months;let cl=shortM,il=investM;
  goals.filter(g=>g.cash&&g.still>0).sort(byDate).forEach(g=>{const a=Math.min(up100(g.monthly),Math.max(0,cl));alloc[g.id]=a;cl-=a});
  goals.filter(g=>!g.cash&&!g.open&&g.still>0).sort(byDate).forEach(g=>{const a=Math.min(up100(g.monthly),Math.max(0,il));alloc[g.id]=a;il-=a});
  const accumM=Math.max(0,il)+Math.max(0,cl);
  const sim=simulateEach(goals,alloc,n(S.rate)),late=goals.filter(g=>n(g.target)>0&&sim[g.id]&&sim[g.id].late>0);
  return{income,fixed,flex,exp,surplus,rate,assets,debt,nw,cash,essential,sTarget,sNeed,sPct,goals,shortNeed,longNeed,goalNeed,budget02,budgetMap,sim,late,
    alloc,accumM,safetyM,sSug,shortM,shortSug,investM,over,safetyETA,shortSaved,cashNeed,cashPart,longPart,million,baseInc,baseExp:baseFix+baseFlex};
}

/* ---------- export ---------- */
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=rej;document.head.appendChild(t)})}
async function saveFile(name,data){let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:name,data});toast('已下載 '+name)}catch(e){toast(e&&e.code==='declined'?'已取消下載':'這裡暫時無法下載')}return}
  try{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('已下載 '+name)}catch(e){toast('下載沒有成功，請換個瀏覽器再試')}}
async function capture(){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');try{await document.fonts.ready}catch(e){}
  return window.html2canvas($('sheet'),{backgroundColor:'#0F0E0B',scale:2,logging:false})}
const baseName=()=>'MMM_'+(((sample||s).profile.name||'My').trim().replace(/[\\/:*?"<>|\s]+/g,'_'))+'_Money_Map';
async function exportPNG(b){b.disabled=true;toast('正在產生圖片…');try{const c=await capture();await saveFile(baseName()+'.png',await new Promise(r=>c.toBlob(r,'image/png')))}catch(e){toast('圖片產生失敗，請再試一次')}b.disabled=false}
async function exportPDF(b){b.disabled=true;toast('正在產生 PDF…');try{const c=await capture();await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const {jsPDF}=window.jspdf,w=210,h=c.height*w/c.width,pdf=new jsPDF({unit:'mm',format:[w,h]});pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,w,h);await saveFile(baseName()+'.pdf',pdf.output('blob'))}catch(e){toast('PDF 產生失敗，請再試一次')}b.disabled=false}

/* ---------- the "build my map" moment ---------- */
function playBuild(S,cb){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){cb();return}
  const M=model(S,{});
  const G=M.goals.filter(g=>n(g.target)>0&&M.sim[g.id]).sort((a,b)=>(M.sim[a.id].done??1e9)-(M.sim[b.id].done??1e9)).slice(0,6);
  const pts=[];for(let k=0;k<=80;k++){const t=k/80;pts.push([60+680*t,140-46*Math.sin(t*Math.PI*1.6+.35)-18*t])}
  const d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
  const fx=document.createElement('div');fx.className='fx';fx.setAttribute('role','dialog');fx.setAttribute('aria-label','正在生成你的 MONEY MAP');
  fx.innerHTML=`<canvas></canvas><div class="fx-c"><div class="fx-top">正在為你畫出地圖</div>
    <svg class="fx-svg" viewBox="0 0 800 240"><path class="fx-path" d="${d}"/><g class="fx-dots"></g></svg>
    <div class="fx-who">${esc(owner(S.profile.name))}</div><div class="fx-title">MONEY MAP</div><div class="fx-sub">每一筆錢，都有它要去的地方。</div></div>
    <button class="fx-skip">略過 →</button>`;
  document.body.appendChild(fx);
  const path=fx.querySelector('.fx-path'),len=path.getTotalLength(),DRAW=3.2,T0=.7;
  path.style.strokeDasharray=len;path.style.strokeDashoffset=len;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{path.style.transition=`stroke-dashoffset ${DRAW}s cubic-bezier(.45,.05,.3,1) ${T0}s`;path.style.strokeDashoffset=0}));
  const dots=fx.querySelector('.fx-dots'),mk=(f,label,yr,i,big)=>{const p=path.getPointAtLength(f*len),up=i%2===0;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','fx-dot');g.style.setProperty('--d',(T0+f*DRAW*.92)+'s');
    g.innerHTML=`<circle class="fx-halo" cx="${p.x}" cy="${p.y}" r="${big?16:12}" fill="none" stroke="#E6CF94"/><circle cx="${p.x}" cy="${p.y}" r="${big?6:4.5}" fill="#E6CF94"/>
      <text x="${p.x}" y="${up?p.y-20:p.y+30}" text-anchor="middle">${esc(label)}</text>${yr?`<text class="y" x="${p.x}" y="${up?p.y-38:p.y+48}" text-anchor="middle">${yr}</text>`:''}`;dots.appendChild(g)};
  mk(0,'現在','',1,true);
  G.forEach((g,i)=>{const r=M.sim[g.id];mk((i+1)/(G.length+1),(g.name||'目標').slice(0,10),r.done==null?'':ymOf(r.done),i,false)});
  mk(1,'MY FUTURE','',G.length%2?1:0,true);
  // gold dust
  const cv=fx.querySelector('canvas'),ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);let W=0,H=0,run=true;
  const size=()=>{W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};size();addEventListener('resize',size);
  const P=Array.from({length:Math.round(Math.min(110,W*H/9000))},()=>({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.5,v:.08+Math.random()*.3,ph:Math.random()*6.3,dr:(Math.random()-.5)*.15}));
  const tick=t=>{if(!run)return;ctx.clearRect(0,0,W,H);for(const q of P){q.y-=q.v;q.x+=q.dr+Math.sin(t*.0006+q.ph)*.08;if(q.y<-4){q.y=H+4;q.x=Math.random()*W}
    const a=.18+.5*(.5+.5*Math.sin(t*.0018+q.ph));ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.283);ctx.fillStyle=`rgba(230,207,148,${a.toFixed(3)})`;ctx.fill()}requestAnimationFrame(tick)};requestAnimationFrame(tick);
  let ended=false;const finish=()=>{if(ended)return;ended=true;cb();fx.classList.add('out');setTimeout(()=>{run=false;removeEventListener('resize',size);fx.remove()},950)};
  fx.querySelector('.fx-skip').onclick=finish;const tm=setTimeout(finish,7200);fx.querySelector('.fx-skip').addEventListener('click',()=>clearTimeout(tm));
}

    W.addEventListener('change',e=>{const g=gid(e),f=e.target.dataset.g;if(!g||(f!=='year'&&f!=='month'))return;const before=termOfGoal(g);g[f]=+e.target.value;save();
      const after=termOfGoal(g);if(after!==before){rerenderGoals();toast('依照時間，已經移到「'+TERMS[after][0]+'」')}else updGoals()});
    W.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.add){const [t,k]=b.dataset.add.split('|'),d=ymAt(t==='short'?6:t==='mid'?36:120);
        const g={id:uid(),kind:k,mode:k==='accum'?'open':'',name:k==='accum'?'持續累積長期資產':'',target:'',saved:'',year:d.y,month:d.m,flexi:''};s.goals.push(g);save();rerenderGoals(k==='accum'?null:g.id);return}
      const g=gid(e);if(!g)return;
      if(b.dataset.del){s.goals=s.goals.filter(x=>x.id!==g.id);save();rerenderGoals();return}
      if(b.dataset.flexi){g.flexi=b.dataset.flexi;b.parentElement.querySelectorAll('[data-flexi]').forEach(x=>x.setAttribute('aria-pressed',x===b));save();updGoals();return}
      if(b.dataset.mode){g.mode=b.dataset.mode;if(g.mode==='num'){const d=ymAt(120);g.year=d.y;g.month=d.m}save();rerenderGoals();return}});
  }
  if(v==='snapshot'){const R=$('root');
    R.querySelectorAll('.addx').forEach(b=>b.onclick=()=>{const k=b.dataset.addx,x={id:uid(),name:'',amt:''};s.extra[k].push(x);save();const y=window.scrollY;render();window.scrollTo({top:y});
      const el=document.querySelector(`[data-xid="${x.id}"] .exn`);if(el)el.focus({preventScroll:true})});
    R.querySelectorAll('.fld.ex').forEach(row=>{const x=s.extra[row.dataset.ex].find(z=>z.id===row.dataset.xid);
      row.querySelector('.exn').oninput=e=>{x.name=e.target.value;save()};
      const a=row.querySelector('.exa');a.oninput=()=>{const r=a.value.replace(/[^\d]/g,'');x.amt=r===''?'':+r;save();updSnapshot()};a.onblur=()=>a.value=comma(x.amt);
      row.querySelector('.exd').onclick=()=>{s.extra[row.dataset.ex]=s.extra[row.dataset.ex].filter(z=>z.id!==x.id);save();row.remove();updSnapshot()}});
  }
  if(v==='plan')document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{s.rate=+b.dataset.rate;document.querySelectorAll('[data-rate]').forEach(x=>x.setAttribute('aria-pressed',x===b));save();updPlan()});
  if(v==='safety')document.querySelectorAll('[data-months]').forEach(b=>b.onclick=()=>{s.months=+b.dataset.months;document.querySelectorAll('[data-months]').forEach(x=>x.setAttribute('aria-pressed',x===b));save();updSafety()});
  if(v==='map'){const S=sample||s;S.wi=S.wi||{};
    $('sheetWrap').addEventListener('click',e=>{const b=e.target.closest('[data-chk]');if(!b)return;S.checks=S.checks||{};S.checks[b.dataset.chk]=!S.checks[b.dataset.chk];save();updWhatIf()});
    $('pngBtn').onclick=e=>exportPNG(e.currentTarget);$('pdfBtn').onclick=e=>exportPDF(e.currentTarget);
    $('wInc').oninput=e=>{S.wi.income=+e.target.value;save();updWhatIf()};
    $('wExp').oninput=e=>{S.wi.spend=+e.target.value;save();updWhatIf()};
    $('wReset').onclick=()=>{S.wi={};save();render()};
  }
}
$('restoreFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(o&&o.v===3)s=fixV3(Object.assign(blank(),o));else if(o&&o.v===2)s=fixV3(migrate(o));else throw 0;s.view='home';save();render();toast('已從備份還原')}catch(x){toast('這個檔案不是 MY MONEY MAP 的備份')}e.target.value=''};r.readAsText(f)});
render();
})();
</script>

</body></html>
